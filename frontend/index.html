<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biblioteca de videojuegos</title>
    <!-- Tipografías del diseño: Barlow Condensed (títulos y logo) y Figtree (texto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Aplica el tema ANTES de pintar nada, para que no haya un parpadeo del
         tema equivocado al cargar. Misma lógica que src/tema.js. -->
    <script>
      (function () {
        var tema = 'oscuro'
        try {
          tema = localStorage.getItem('tema')
          if (tema !== 'claro' && tema !== 'oscuro') {
            tema = matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'oscuro'
          }
        } catch (e) {
          tema = 'oscuro'
        }
        document.documentElement.dataset.tema = tema
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
