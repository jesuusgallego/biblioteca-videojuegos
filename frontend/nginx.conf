server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router gestiona las rutas (/biblioteca, /buscar...) en el navegador.
    # Si alguien recarga en /biblioteca, nginx no tiene ese archivo: en vez de
    # dar 404, devolvemos index.html y deja que React decida qué pantalla mostrar.
    location / {
        try_files $uri /index.html;
    }
}
