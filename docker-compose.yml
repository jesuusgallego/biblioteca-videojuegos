services:
  postgres:
    image: postgres:16-alpine
    container_name: biblioteca_db
    environment:
      POSTGRES_USER: biblioteca_user
      POSTGRES_PASSWORD: biblioteca_pass
      POSTGRES_DB: biblioteca_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Los .sql de esta carpeta se ejecutan SOLO la primera vez, con el volumen
      # vacío: así las tablas se crean solas.
      - ./backend/src/models/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      # "Healthy" = Postgres ya acepta conexiones
      test: ["CMD-SHELL", "pg_isready -U biblioteca_user -d biblioteca_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: biblioteca_backend
    env_file:
      - ./backend/.env        # JWT_SECRET, claves de Twitch... (no se sube a git)
    environment:
      # Dentro de la red de Docker la BD se llama "postgres" (nombre del servicio),
      # no "localhost". Esto pisa el DATABASE_URL del .env.
      DATABASE_URL: postgresql://biblioteca_user:biblioteca_pass@postgres:5432/biblioteca_db
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy   # espera a que la BD esté lista

  frontend:
    build: ./frontend
    container_name: biblioteca_frontend
    ports:
      - "5173:80"   # http://localhost:5173 -> puerto 80 de nginx
    depends_on:
      - backend

volumes:
  pgdata:
